<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undergraduate Entry Requirements | Admissions CMS</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="global-header">
      <div class="global-header-title">Undergraduate Entry Requirements</div>
      <div style="display: flex; gap: 15px; align-items: center;">
        <button class="btn-action" style="background: var(--success); color: white; border: none; font-weight: 800; padding: 10px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" onclick="saveJSON()">
          <span style="font-size: 1.2rem; margin-right: 8px;">💾</span> Save JSON
        </button>
        <button class="menu-toggle" onclick="toggleSidebar()">☰ Menu</button>
      </div>
    </header>

    <div id="notification" class="toast-notification">
      <span class="toast-icon">✓</span> Data saved successfully
    </div>

    <div class="container app-layout">
      <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

      <aside class="sidebar" id="app-sidebar">
        <div class="view-tabs">
          <button
            class="view-tab active"
            onclick="switchView('profiles')"
            id="tab-profiles"
          >
            Base Profiles
          </button>
          <button
            class="view-tab"
            onclick="switchView('general')"
            id="tab-general"
          >
            General Reqs
          </button>
        </div>

        <div class="sidebar-header" id="sidebar-header">
          <span
            style="font-size: 1.1rem; font-weight: 800; color: var(--text-dark)"
            id="sidebar-title"
            >Base Profiles</span
          >
          <button class="btn-new-profile" onclick="addNewSidebarItem()">
            + Add New
          </button>
        </div>
        <div class="profile-list" id="sidebar-list"></div>
      </aside>

      <main class="main-editor">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📂</div>
          <h2>Select an Item</h2>
          <p>Choose an item from the sidebar to view and edit its details.</p>
        </div>

        <div id="editor-profiles" class="editor-panel" style="display: none">
          <div class="editor-header-card">
            <!-- Top Action Bar -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed var(--border-light);">
              <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); background: #f1f5f9; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-light);" id="profile-id-display">
                T4 Mapping ID: 
              </div>
              <div style="display: flex; gap: 10px">
                <button
                  class="btn-action"
                  onclick="duplicateCurrentItem()"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                  Clone
                </button>
                <button class="btn-action btn-action-danger" onclick="deleteCurrentItem()">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                  Delete
                </button>
              </div>
            </div>

            <!-- Form Fields Stack -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
              <div>
                <label for="profile-title" style="font-size:0.75rem; text-transform:uppercase; font-weight:800; color:var(--text-light); letter-spacing:0.5px; margin-bottom: 8px; display:block;">Profile Designation</label>
                <input
                  type="text"
                  class="modern-input"
                  id="profile-title"
                  placeholder="e.g. Profile 01"
                  style="font-size: 1.5rem; font-weight: 800; padding: 12px 16px; color: var(--text-dark); width: 100%; border-radius: 8px; border: 1px solid var(--border-light);"
                />
              </div>
              
              <div>
                <label for="profile-subtitle" style="font-size:0.75rem; text-transform:uppercase; font-weight:800; color:var(--text-light); letter-spacing:0.5px; margin-bottom: 8px; display:block;">Applicable Subjects</label>
                <input
                  type="text"
                  class="modern-input"
                  id="profile-subtitle"
                  placeholder="e.g. Art History MA"
                  style="font-size: 1.1rem; padding: 12px 16px; color: var(--text-dark); width: 100%; border-radius: 8px; border: 1px solid var(--border-light);"
                />
              </div>

              <div>
                <label for="profile-school" style="font-size:0.75rem; text-transform:uppercase; font-weight:800; color:var(--text-light); letter-spacing:0.5px; margin-bottom: 8px; display:block;">Parent School / Category</label>
                <select
                  id="profile-school"
                  class="modern-select"
                  style="padding: 12px 16px; width: 100%; max-width: 400px; font-size: 1rem; border-radius: 8px; border: 1px solid var(--border-light); background-color: #f8fafc; color: var(--text-main);"
                >
                  <option value="Unassigned">Unassigned / General</option>
                  <option value="Art History">Art History</option>
                  <option value="Biology">Biology</option>
                  <option value="Business School">Business School</option>
                  <option value="Chemistry">Chemistry</option>
                  <option value="Classics">Classics</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Divinity">Divinity</option>
                  <option value="Earth & Environmental Science">Earth & Environmental Science</option>
                  <option value="Economics">Economics</option>
                  <option value="English">English</option>
                  <option value="Geography & Sustainable Development">Geography & Sustainable Development</option>
                  <option value="History">History</option>
                  <option value="International Relations">International Relations</option>
                  <option value="Mathematics">Mathematics</option>
                  <option value="Modern Languages">Modern Languages</option>
                  <option value="Philosophical, Anthropological and Film Studies">Philosophical, Anthropological and Film Studies</option>
                  <option value="Physics & Astronomy">Physics & Astronomy</option>
                  <option value="Psychology & Neuroscience">Psychology & Neuroscience</option>
                </select>
              </div>
            </div>
          </div>

          <div class="section-title">
            <span>Qualifications in this Tier</span>
            <button class="btn-add-sm" onclick="addNewQualification()">
              + Add Qualification
            </button>
          </div>
          
          <div style="margin-bottom: 30px; position: relative; max-width: 500px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dpl-mid-grey)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="qual-search" class="modern-input" placeholder="Type to filter qualifications below..." onkeyup="filterQualifications()" style="padding-left: 45px; border-radius: 30px; border: 1px solid var(--border-color); box-shadow: 0 2px 6px rgba(0,0,0,0.02); font-size: 1rem; color: var(--text-dark); background-color: white; width: 100%;">
          </div>

          <div id="profile-grades-container"></div>
        </div>

        <div id="editor-general" class="editor-panel" style="display: none">
          <div class="editor-header-card">
            <!-- Top Action Bar -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px dashed var(--border-light);">
              <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-main); background: #f1f5f9; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-light);" id="general-id-display">
                ID:
              </div>
              <button class="btn-action btn-action-danger" onclick="deleteCurrentItem()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2-2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                Delete
              </button>
            </div>

            <!-- Form Fields Stack -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
              <div>
                <label for="general-title" style="font-size:0.75rem; text-transform:uppercase; font-weight:800; color:var(--text-light); letter-spacing:0.5px; margin-bottom: 8px; display:block;">Profile Name</label>
                <input
                  type="text"
                  class="modern-input"
                  id="general-title"
                  placeholder="e.g. Standard Route"
                  style="font-size: 1.5rem; font-weight: 800; padding: 12px 16px; color: var(--text-dark); width: 100%; border-radius: 8px; border: 1px solid var(--border-light);"
                />
              </div>
            </div>
          </div>

          <div class="section-title">Boilerplate Requirements</div>
          <div class="test-card">
            <label class="modern-label">SQA General Requirements text</label>
            <textarea
              class="modern-textarea"
              id="general-sqa"
              rows="4"
            ></textarea>
          </div>
          <div class="test-card">
            <label class="modern-label">GCSE General Requirements text</label>
            <textarea
              class="modern-textarea"
              id="general-gcse"
              rows="4"
            ></textarea>
          </div>
        </div>
      </main>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
